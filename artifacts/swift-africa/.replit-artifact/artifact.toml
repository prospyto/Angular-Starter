kind = "web"
previewPath = "/"
title = "Swift Africa"
version = "1.0.0"
id = "artifacts/swift-africa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3001

[services.development]
run = "PORT=3001 BASE_PATH=/ pnpm --filter @workspace/swift-africa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swift-africa", "run", "build" ]
publicDir = "artifacts/swift-africa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3001"
BASE_PATH = "/"
